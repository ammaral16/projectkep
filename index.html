        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'e' && gameStarted) checkInteraction();
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });
        
        function startGame() {
            document.getElementById('titleScreen').classList.add('hidden');
            document.getElementById('hudContainer').classList.add('active');
            gameStarted = true;
            currentRoom = 1;
            keysCollected = 0;
            roomCleared = false;
            puzzleAnswered = false;
            player.hp = 200;
            player.x = 450;
            player.y = 325;
            timeElapsed = 0;
            particles = [];
            
            // Reset heal collected status and uses
            for (let i = 1; i <= 5; i++) {
                if (roomData[i].heal) {
                    roomData[i].heal.collected = false;
                    roomData[i].heal.uses = 0;
                }
            }
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeElapsed++;
                updateTime();
            }, 1000);
            
            showNotification("Gunakan WASD untuk gerak, E untuk interaksi!");
            updateHUD();
        }
        
        function updateTime() {
            const mins = Math.floor(timeElapsed / 60);
            const secs = timeElapsed % 60;
            document.getElementById('time').textContent = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function update() {
            if (!gameStarted) return;
            
            let newX = player.x;
            let newY = player.y;
            
            if (keys['w'] || keys['arrowup']) newY -= player.speed;
            if (keys['s'] || keys['arrowdown']) newY += player.speed;
            if (keys['a'] || keys['arrowleft']) newX -= player.speed;
            if (keys['d'] || keys['arrowright']) newX += player.speed;
            
            newX = Math.max(25, Math.min(875, newX));
            newY = Math.max(25, Math.min(625, newY));
            
            const room = roomData[currentRoom];
            let canMove = true;
            
            for (const obs of room.obstacles) {
                if (newX > obs.x && newX < obs.x + obs.w &&
                    newY > obs.y && newY < obs.y + obs.h) {
                    canMove = false;
                }
            }
            
            if (canMove) {
                player.x = newX;
                player.y = newY;
            }
            
            // Update enemies
            if (room.enemies) {
                for (const enemy of room.enemies) {
                    if (enemy.patrol) {
                        const target = enemy.points[enemy.current];
                        const dx = target.x - enemy.x;
                        const dy = target.y - enemy.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        
                        if (dist < 5) {
                            enemy.current = (enemy.current + 1) % enemy.points.length;
                        } else {
                            enemy.x += (dx/dist) * enemy.speed;
                            enemy.y += (dy/dist) * enemy.speed;
                        }
                    } else if (enemy.chase) {
                        const dx = player.x - enemy.x;
                        const dy = player.y - enemy.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        
                        if (dist < 250) {
                            enemy.x += (dx/dist) * enemy.speed;
                            enemy.y += (dy/dist) * enemy.speed;
                        }
                    }
                    
                    // Check enemy collision
                    const enemyDist = Math.sqrt((player.x - enemy.x)**2 + (player.y - enemy.y)**2);
                    if (enemyDist < 35) {
                        const now = Date.now();
                        if (now - lastDamageTime > 1000) {
                            player.hp -= enemy.damage;
                            lastDamageTime = now;
                            showNotification(`Diserang musuh! -${enemy.damage} HP`, true);
                            updateHUD();
                            createParticles(player.x, player.y, '#ff0000', 10);
                            
                            if (player.hp <= 0) {
                                player.hp = 0;
                                gameStarted = false;
                                clearInterval(timerInterval);
                                document.getElementById('hudContainer').classList.remove('active');
                                alert("GAME OVER - HP habis!");
                                document.getElementById('titleScreen').classList.remove('hidden');
                            }
                        }
                    }
                }
            }
            
            // Check traps
            for (const trap of room.traps) {
                if (player.x > trap.x && player.x < trap.x + trap.w &&
                    player.y > trap.y && player.y < trap.y + trap.h) {
                    const now = Date.now();
                    if (now - lastDamageTime > 500) {
                        player.hp -= trap.damage;
                        lastDamageTime = now;
                        showNotification(`Terkena trap! -${trap.damage} HP`, true);
                        updateHUD();
                        createParticles(player.x, player.y, '#ff4444', 8);
                        
                        if (player.hp <= 0) {
                            player.hp = 0;
                            gameStarted = false;
                            clearInterval(timerInterval);
                            document.getElementById('hudContainer').classList.remove('active');
                            alert("GAME OVER - HP habis!");
                            document.getElementById('titleScreen').classList.remove('hidden');
                        }
                    }
                }
            }
            
            // Update particles
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                p.alpha -= 0.02;
            });
        }
        
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 30,
                    alpha: 1,
                    color: color
                });
            }
        }
        
        function draw() {
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, 0, 900, 650);
            
            if (!gameStarted) {
                drawTitleBackground();
                return;
            }
            
            const room = roomData[currentRoom];
            const theme = room.theme;
            
            // Draw floor
            ctx.fillStyle = theme.bg;
            ctx.fillRect(0, 0, 900, 650);
            
            // Draw floor tiles
            ctx.fillStyle = theme.floor;
            for (let x = 50; x < 850; x += 100) {
                for (let y = 50; y < 600; y += 100) {
                    ctx.fillRect(x, y, 90, 90);
                }
            }
            
            // Draw walls
            ctx.fillStyle = theme.wall;
            ctx.fillRect(0, 0, 900, 40);
            ctx.fillRect(0, 610, 900, 40);
            ctx.fillRect(0, 0, 40, 650);
            ctx.fillRect(860, 0, 40, 650);
            
            // Draw obstacles with 3D effect
            for (const obs of room.obstacles) {
                ctx.fillStyle = '#4a4a6a';
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.fillStyle = '#5a5a7a';
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h - 5);
                ctx.fillStyle = '#3a3a5a';
                ctx.fillRect(obs.x + obs.w - 5, obs.y, 5, obs.h);
            }
            
            // Draw traps with glow
            for (const trap of room.traps) {
                ctx.fillStyle = 'rgba(255, 68, 68, 0.3)';
                ctx.beginPath();
                ctx.arc(trap.x + trap.w/2, trap.y + trap.h/2, 30, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(trap.x, trap.y, trap.w, trap.h);
                ctx.fillStyle = '#ff6666';
                ctx.fillRect(trap.x + 5, trap.y + 5, trap.w - 10, trap.h - 10);
            }
            
            // Draw enemies
            if (room.enemies) {
                for (const enemy of room.enemies) {
                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(enemy.x, enemy.y + 20, 20, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Body
                    ctx.fillStyle = '#8b0000';
                    ctx.beginPath();
                    ctx.arc(enemy.x, enemy.y, 20, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(enemy.x, enemy.y, 15, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Eyes
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(enemy.x - 6, enemy.y - 4, 5, 0, Math.PI * 2);
                    ctx.arc(enemy.x + 6, enemy.y - 4, 5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(enemy.x - 6, enemy.y - 4, 2, 0, Math.PI * 2);
                    ctx.arc(enemy.x + 6, enemy.y - 4, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // Draw NPC with better design
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(room.npc.x, room.npc.y + 20, 22, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#6a8a6a';
            ctx.beginPath();
            ctx.arc(room.npc.x, room.npc.y, 22, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ffcc99';
            ctx.beginPath();
            ctx.arc(room.npc.x, room.npc.y, 16, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(room.npc.x - 6, room.npc.y - 4, 4, 0, Math.PI * 2);
            ctx.arc(room.npc.x + 6, room.npc.y - 4, 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#4a2a2a';
            ctx.fillRect(room.npc.x - 18, room.npc.y - 22, 36, 10);
            
            // Draw key with glow
            if (puzzleAnswered && !roomCleared && room.key) {
                ctx.fillStyle = 'rgba(255, 215, 0, 0.4)';
                ctx.beginPath();
                ctx.arc(room.key.x, room.key.y, 25, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#ffd700';
                ctx.fillRect(room.key.x - 12, room.key.y - 6, 24, 12);
                ctx.fillRect(room.key.x + 12, room.key.y - 10, 8, 20);
                ctx.fillRect(room.key.x + 20, room.key.y - 4, 8, 8);
            }
            
            // Draw heal item
            if (room.heal && room.heal.uses < room.heal.maxUses) {
                ctx.fillStyle = 'rgba(0, 255, 0, 0.4)';
                ctx.beginPath();
                ctx.arc(room.heal.x, room.heal.y, 25, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#00ff00';
                ctx.beginPath();
                ctx.arc(room.heal.x, room.heal.y, 18, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(room.heal.x - 4, room.heal.y - 12, 8, 24);
                ctx.fillRect(room.heal.x - 12, room.heal.y - 4, 24, 8);
                
                // Show uses remaining
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText(`${room.heal.maxUses - room.heal.uses}/${room.heal.maxUses}`, room.heal.x, room.heal.y + 35);
            }
            
            // Draw door
            if (room.door) {
                if (roomCleared) {
                    ctx.fillStyle = 'rgba(148, 0, 211, 0.3)';
                    ctx.beginPath();
                    ctx.arc(room.door.x, room.door.y, 35, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#9400d3';
                } else {
                    ctx.fillStyle = '#8b4513';
                }
                ctx.fillRect(room.door.x - 25, room.door.y - 35, 50, 70);
                
                if (!roomCleared) {
                    ctx.fillStyle = '#ffd700';
                    ctx.fillRect(room.door.x - 8, room.door.y - 8, 16, 16);
                }
            }
            
            // Draw player with better design
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(player.x, player.y + 20, 22, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#4a7a4a';
            ctx.beginPath();
            ctx.arc(player.x, player.y, 22, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ffcc99';
            ctx.beginPath();
            ctx.arc(player.x, player.y, 16, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(player.x - 6, player.y - 4, 4, 0, Math.PI * 2);
            ctx.arc(player.x + 6, player.y - 4, 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#4a3a2a';
            ctx.fillRect(player.x - 18, player.y - 22, 36, 10);
            
            // Draw particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            
            // Draw room info
            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText(`Ruang ${currentRoom}: ${room.name}`, 450, 30);
            
            // Draw interaction hints
            ctx.font = '16px Segoe UI';
            ctx.textAlign = 'center';
            
            const distNPC = Math.sqrt((player.x - room.npc.x)**2 + (player.y - room.npc.y)**2);
            if (distNPC < 60 && !puzzleAnswered) {
                ctx.fillStyle = '#ffd700';
                ctx.fillText('[E] NPC', room.npc.x, room.npc.y - 35);
            }
            
            if (room.key && puzzleAnswered && !roomCleared) {
                const distKey = Math.sqrt((player.x - room.key.x)**2 + (player.y - room.key.y)**2);
                if (distKey < 60) {
                    ctx.fillStyle = '#ffd700';
                    ctx.fillText('[E] Kunci', room.key.x, room.key.y - 30);
                }
            }
            
            if (room.heal && room.heal.uses < room.heal.maxUses) {
                const distHeal = Math.sqrt((player.x - room.heal.x)**2 + (player.y - room.heal.y)**2);
                if (distHeal < 60) {
                    ctx.fillStyle = '#00ff00';
                    ctx.fillText(`[E] Heal (${room.heal.maxUses - room.heal.uses}/${room.heal.maxUses})`, room.heal.x, room.heal.y - 30);
                }
            }
            
            if (room.door) {
                const distDoor = Math.sqrt((player.x - room.door.x)**2 + (player.y - room.door.y)**2);
                if (distDoor < 60) {
                    ctx.fillStyle = roomCleared ? '#da70d6' : '#ffd700';
                    ctx.fillText('[E] Pintu', room.door.x, room.door.y - 50);
                }
            }
        }
        
        function drawTitleBackground() {
            // Draw ancient ruins
            ctx.fillStyle = '#1a1a3a';
            ctx.fillRect(100, 200, 220, 320);
            ctx.fillRect(580, 200, 220, 320);
            
            ctx.fillStyle = '#2a2a4a';
            ctx.fillRect(150, 140, 35, 380);
            ctx.fillRect(330, 140, 35, 380);
            ctx.fillRect(530, 140, 35, 380);
            ctx.fillRect(715, 140, 35, 380);
            
            // Draw glowing artifact with animation
            const time = Date.now() / 1000;
            const glowSize = 25 + Math.sin(time * 2) * 5;
            
            ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
            ctx.beginPath();
            ctx.arc(450, 320, glowSize + 15, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(450, 320, 25, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ffec8b';
            ctx.beginPath();
            ctx.arc(450, 320, 15, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function checkInteraction() {
            const room = roomData[currentRoom];
            
            const distNPC = Math.sqrt((player.x - room.npc.x)**2 + (player.y - room.npc.y)**2);
            if (distNPC < 60 && !puzzleAnswered) {
                showPuzzle();
                return;
            }
            
            // Check heal item
            if (room.heal) {
                const distHeal = Math.sqrt((player.x - room.heal.x)**2 + (player.y - room.heal.y)**2);
                if (distHeal < 60 && room.heal.uses < room.heal.maxUses) {
                    room.heal.uses++;
                    player.hp = Math.min(player.maxHp, player.hp + room.heal.healAmount);
                    updateHUD();
                    showNotification(`HP +${room.heal.healAmount}! (${room.heal.uses}/${room.heal.maxUses})`, false);
                    createParticles(room.heal.x, room.heal.y, '#00ff00', 12);
                    
                    if (room.heal.uses >= room.heal.maxUses) {
                        room.heal.collected = true;
                    }
                    return;
                }
            }
            
            if (room.key) {
                const distKey = Math.sqrt((player.x - room.key.x)**2 + (player.y - room.key.y)**2);
                if (distKey < 60 && puzzleAnswered && !roomCleared) {
                    keysCollected++;
                    roomCleared = true;
                    updateHUD();
                    showNotification("Kunci didapat! Pintu terbuka!");
                    createParticles(room.key.x, room.key.y, '#ffd700', 15);
                    
                    // Room 5: Show congrats screen instead of camera
                    if (currentRoom === 5) {
                        setTimeout(() => {
                            if (gameStarted) {
                                showCongratsScreen();
                            }
                        }, 1500);
                    }
                    return;
                }
            }
            
            if (room.door) {
                const distDoor = Math.sqrt((player.x - room.door.x)**2 + (player.y - room.door.y)**2);
                if (distDoor < 60) {
                    if (roomCleared) {
                        currentRoom++;
                        player.x = 50;
                        player.y = 325;
                        puzzleAnswered = false;
                        roomCleared = false;
                        updateHUD();
                        showNotification(`Masuk Ruang ${currentRoom}`);
                    } else {
                        showNotification("Pintu terkunci! Jawab soal dulu.", true);
                    }
                    return;
                }
            }
        }
        
        function showPuzzle() {
            const room = roomData[currentRoom];
            document.getElementById('puzzleQuestion').textContent = room.question;
            const optionsDiv = document.getElementById('puzzleOptions');
            optionsDiv.innerHTML = '';
            
            room.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'puzzleOption';
                btn.textContent = opt;
                btn.onclick = () => answerPuzzle(idx);
                optionsDiv.appendChild(btn);
            });
            
            document.getElementById('puzzleUI').classList.add('active');
        }
        
        function answerPuzzle(idx) {
            const room = roomData[currentRoom];
            document.getElementById('puzzleUI').classList.remove('active');
            
            if (idx === room.correct) {
                puzzleAnswered = true;
                showNotification("Jawaban benar! Kunci muncul!");
                createParticles(room.npc.x, room.npc.y, '#00ff00', 12);
            } else {
                showNotification("Jawaban salah! -5 HP", true);
                player.hp -= 5;
                updateHUD();
                createParticles(player.x, player.y, '#ff0000', 8);
                
                if (player.hp <= 0) {
                    player.hp = 0;
                    gameStarted = false;
                    clearInterval(timerInterval);
                    document.getElementById('hudContainer').classList.remove('active');
                    alert("GAME OVER - HP habis!");
                    document.getElementById('titleScreen').classList.remove('hidden');
                }
            }
        }
        
        function updateHUD() {
            document.getElementById('hp').textContent = player.hp;
            document.getElementById('room').textContent = currentRoom;
            document.getElementById('keys').textContent = keysCollected;
        }
        
        function showNotification(text, isDanger = false) {
            const notif = document.getElementById('notification');
            notif.textContent = text;
            notif.style.background = isDanger ? 'rgba(80, 20, 20, 0.95)' : 'rgba(50, 50, 80, 0.95)';
            notif.style.color = isDanger ? '#ff4444' : '#ffd700';
            notif.classList.add('active');
            setTimeout(() => notif.classList.remove('active'), 2500);
        }
        
        function showGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            const photos = JSON.parse(localStorage.getItem('gamePhotos') || '[]');
            
            if (photos.length === 0) {
                document.getElementById('galleryMessage').textContent = 'Belum ada foto. Selesaikan game untuk ambil selfie!';
            } else {
                document.getElementById('galleryMessage').textContent = `Total ${photos.length} foto pemenang`;
                photos.forEach(photo => {
                    const img = document.createElement('img');
                    img.src = photo.data;
                    img.className = 'galleryPhoto';
                    grid.appendChild(img);
                });
            }
            
            document.getElementById('galleryScreen').classList.add('active');
        }
        
        function hideGallery() {
            document.getElementById('galleryScreen').classList.remove('active');
        }
        
        function showCongratsScreen() {
            gameStarted = false;
            clearInterval(timerInterval);
            document.getElementById('hudContainer').classList.remove('active');
            
            const mins = Math.floor(timeElapsed / 60);
            const secs = timeElapsed % 60;
            const timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            document.getElementById('congratsStats').innerHTML = `
                <p>⏱️ Waktu: ${timeStr}</p>
                <p>❤️ HP Akhir: ${player.hp}/200</p>
                <p>🔑 Kunci: ${keysCollected}/5</p>
            `;
            
            document.getElementById('congratsScreen').classList.add('active');
        }
        
        function skipCamera() {
            document.getElementById('congratsScreen').classList.remove('active');
            document.getElementById('titleScreen').classList.remove('hidden');
            document.getElementById('hudContainer').classList.remove('active');
        }
        
        function startCamera() {
            document.getElementById('congratsScreen').classList.remove('active');
            
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    document.getElementById('video').srcObject = stream;
                    document.getElementById('cameraScreen').classList.add('active');
                })
                .catch(err => {
                    console.error(err);
                    alert('Tidak bisa akses kamera');
                    showGallery();
                });
        }
        
        function capturePhoto() {
            const video = document.getElementById('video');
            const canvasPhoto = document.getElementById('canvasPhoto');
            const contextPhoto = canvasPhoto.getContext('2d');
            
            canvasPhoto.width = video.videoWidth;
            canvasPhoto.height = video.videoHeight;
            contextPhoto.drawImage(video, 0, 0);
            
            const photoData = canvasPhoto.toDataURL('image/jpeg');
            const photos = JSON.parse(localStorage.getItem('gamePhotos') || '[]');
            photos.push({
                data: photoData,
                date: new Date().toLocaleString('id-ID'),
                score: keysCollected,
                time: timeElapsed
            });
            localStorage.setItem('gamePhotos', JSON.stringify(photos));
            
            const stream = video.srcObject;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            
            document.getElementById('cameraScreen').classList.remove('active');
            showGallery();
            
            setTimeout(() => {
                hideGallery();
                document.getElementById('titleScreen').classList.remove('hidden');
            }, 5000);
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();
    </script>
</body>
</html>
